# Site
title            : "Meng Cheng's Homepage"
name             : "Meng Cheng"
description      : "Meng Cheng is a theoretical physicist at Yale University working on quantum condensed matter theory: the classification and characterization of exotic quantum phases of matter."
url              : "https://meng-cheng.github.io"
baseurl          : ""
repository       : "meng-cheng/meng-cheng.github.io"
locale           : "en-US"
timezone         : America/New_York
words_per_minute : 160
future           : true

author:
  name          : "Meng Cheng"
  avatar        : "mc-small.jpg"
  bio           : "condensed matter theorist"
  location      : "New Haven, CT"
  email         : "m.cheng@yale.edu"
  googlescholar : "https://scholar.google.com/citations?user=3lyNWR0AAAAJ&hl=en"

# Build
markdown   : kramdown
highlighter: rouge
kramdown:
  input        : GFM
  auto_ids     : true
  smart_quotes : lsquo,rsquo,ldquo,rdquo

include: [_pages]
exclude: [Gemfile, Gemfile.lock, vendor, .bundle, README.md]

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

# Content
# Notes land at /posts/YYYY/MM/slug/ from the filename date, so a post needs
# no permalink of its own. An explicit front-matter permalink still wins.
permalink: /posts/:year/:month/:title/

collections:
  teaching:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope: {path: "", type: posts}
    values: {layout: post, math: true}
  - scope: {path: "", type: pages}
    values: {layout: page}
  - scope: {path: "", type: teaching}
    values: {layout: page}
