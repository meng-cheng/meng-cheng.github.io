---
layout: default
---
<article class="page">
  <h1 class="page__title">{{ page.title }}</h1>
  <p class="page__date">
    <strong>{% include icon.html name="calendar" %} Date:</strong>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </p>
  {% if page.venue %}
    <p class="page__meta">{{ page.type | default: "Talk" }} at <i>{{ page.venue }}</i>{% if page.location %}, {{ page.location }}{% endif %}</p>
  {% endif %}
  <div class="page__content">
    {{ content }}
  </div>
</article>
