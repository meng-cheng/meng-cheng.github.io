<div class="masthead">
  <nav class="masthead__inner" aria-label="Main">
    <a class="masthead__title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <ul class="masthead__menu">
      {% for link in site.data.navigation.main %}
        <li><a href="{% if link.url contains '://' %}{{ link.url }}{% else %}{{ link.url | relative_url }}{% endif %}">{{ link.title }}</a></li>
      {% endfor %}
    </ul>
  </nav>
</div>
